<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Appointment | PawCare</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <div class="logo">
          <i class="fa-solid fa-paw"></i>
          <h2>PawCare</h2>
        </div>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="register.html">Register Pet</a></li>
          <li><a href="appointment.html" class="active">Appointments</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <section class="page-header">
      <h1>Book an Appointment</h1>

      <p>
        Schedule a consultation with one of our veterinary doctors. Choose your
        preferred date and time.
      </p>
    </section>

    <section class="registration">
      <div class="form-container">
        <h2>Appointment Booking Form</h2>

        <form id="appointmentForm">
          <div class="form-row">
            <div class="input-group">
              <label>Owner Name</label>

              <input type="text" id="owner" required />
            </div>

            <div class="input-group">
              <label>Pet Name</label>

              <input type="text" id="pet" required />
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label>Species</label>

              <select id="species">
                <option>Dog</option>
                <option>Cat</option>
                <option>Rabbit</option>
                <option>Goat</option>
                <option>Cattle</option>
                <option>Sheep</option>
                <option>Horse</option>
                <option>Other</option>
              </select>
            </div>

            <div class="input-group">
              <label>Service Required</label>

              <select id="service">
                <option>General Consultation</option>
                <option>Vaccination</option>
                <option>Surgery</option>
                <option>Deworming</option>
                <option>Treatment</option>
                <option>Pregnancy Diagnosis</option>
                <option>Emergency Care</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label>Appointment Date</label>

              <input type="date" id="date" required />
            </div>

            <div class="input-group">
              <label>Preferred Time</label>

              <input type="time" id="time" required />
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label>Veterinarian</label>

              <select id="doctor">
                <option>Dr. Franklin</option>
                <option>Dr. James</option>
                <option>Dr. Mercy</option>
                <option>Dr. Peter</option>
              </select>
            </div>

            <div class="input-group">
              <label>Contact Number</label>

              <input type="tel" id="phone" required />
            </div>
          </div>

          <div class="input-group">
            <label>Additional Notes</label>

            <textarea
              id="notes"
              rows="5"
              placeholder="Describe the pet's condition..."
            ></textarea>
          </div>

          <button type="submit" class="btn">
            <i class="fa-solid fa-calendar-check"></i>

            Book Appointment
          </button>
        </form>
      </div>
    </section>

    <footer>
      <p>©2026 PawCare Veterinary Clinic Management System</p>
    </footer>

    <script src="appointment.js"></script>
  </body>
</html>
