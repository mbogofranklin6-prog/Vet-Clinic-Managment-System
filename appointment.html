<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Appointment | PawCare</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header>
      <nav class="navbar">
        <div class="logo">
          <i class="fa-solid fa-paw"></i>
          <h2>PawCare</h2>
        </div>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="register.html">Register Pet</a></li>
          <li><a href="appointment.html" class="active">Appointments</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- ================= PAGE HEADER ================= -->

    <section class="page-header">
      <h1>Book an Appointment</h1>
      <p>Schedule a consultation for your pet in a few easy steps.</p>
    </section>

    <!-- ================= APPOINTMENT FORM ================= -->

    <section class="appointment">
      <div class="form-container">
        <form id="appointmentForm">
          <h2>Appointment Details</h2>

          <div class="input-group">
            <label for="petName">Pet Name</label>
            <input type="text" id="petName" required />
          </div>

          <div class="input-group">
            <label for="ownerName">Owner Name</label>
            <input type="text" id="ownerName" required />
          </div>

          <div class="input-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required />
          </div>

          <div class="input-group">
            <label for="service">Service</label>

            <select id="service" required>
              <option value="">Select Service</option>
              <option>Vaccination</option>
              <option>General Check-up</option>
              <option>Surgery</option>
              <option>Dental Care</option>
              <option>Emergency Care</option>
              <option>Deworming</option>
            </select>
          </div>

          <div class="input-group">
            <label for="doctor">Veterinarian</label>

            <select id="doctor" required>
              <option value="">Select Veterinarian</option>
              <option>Dr. James</option>
              <option>Dr. Sarah</option>
              <option>Dr. Peter</option>
            </select>
          </div>

          <div class="input-group">
            <label for="date">Appointment Date</label>
            <input type="date" id="date" required />
          </div>

          <div class="input-group">
            <label for="time">Appointment Time</label>
            <input type="time" id="time" required />
          </div>

          <div class="input-group">
            <label for="notes">Additional Notes</label>
            <textarea id="notes" rows="4"></textarea>
          </div>

          <button type="submit" class="btn">
            <i class="fa-solid fa-calendar-check"></i>
            Book Appointment
          </button>
        </form>
      </div>
    </section>

    <!-- ================= FOOTER ================= -->

    <footer>
      <p>
        2026 PawCare Veterinary Clinic Management System. All Rights Reserved.
      </p>
    </footer>

    <script src="appointment.js"></script>
  </body>
</html>
