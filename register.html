<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Pet | PawCare Veterinary Clinic</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <!--================== HEADER ==================-->

    <header>
      <nav class="navbar">
        <div class="logo">
          <i class="fa-solid fa-paw"></i>
          <h2>PawCare</h2>
        </div>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="register.html" class="active">Register Pet</a></li>
          <li><a href="appointments.html">Appointments</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!--================== PAGE HEADER ==================-->

    <section class="page-header">
      <h1>Register Your Pet</h1>

      <p>
        Fill in the information below to register your pet in our clinic
        database.
      </p>
    </section>

    <!--================== REGISTRATION FORM ==================-->

    <section class="registration">
      <div class="form-container">
        <form id="petForm">
          <h2>Pet Registration Form</h2>

          <div class="input-group">
            <label for="ownerName">Owner's Full Name</label>
            <input
              type="text"
              id="ownerName"
              placeholder="Enter owner's name"
              required
            />
          </div>

          <div class="input-group">
            <label for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              placeholder="e.g. 0712345678"
              required
            />
          </div>

          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="example@email.com" />
          </div>

          <div class="input-group">
            <label for="petName">Pet Name</label>
            <input type="text" id="petName" placeholder="Pet's name" required />
          </div>

          <div class="input-group">
            <label for="species">Species</label>

            <select id="species" required>
              <option value="">Select Species</option>
              <option>Dog</option>
              <option>Cat</option>
              <option>Rabbit</option>
              <option>Bird</option>
              <option>Goat</option>
              <option>Cattle</option>
              <option>Horse</option>
              <option>Other</option>
            </select>
          </div>

          <div class="input-group">
            <label for="breed">Breed</label>
            <input type="text" id="breed" />
          </div>

          <div class="input-group">
            <label for="gender">Gender</label>

            <select id="gender">
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>

          <div class="input-group">
            <label for="age">Age</label>
            <input type="number" id="age" />
          </div>

          <div class="input-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" />
          </div>

          <div class="input-group">
            <label for="colour">Colour</label>
            <input type="text" id="colour" />
          </div>

          <div class="input-group">
            <label for="medicalHistory">Medical History</label>

            <textarea
              id="medicalHistory"
              rows="5"
              placeholder="Describe previous illnesses, allergies or medications..."
            ></textarea>
          </div>

          <button type="submit" class="btn">
            <i class="fa-solid fa-paw"></i>
            Register Pet
          </button>
        </form>
      </div>
    </section>

    <!--================== FOOTER ==================-->

    <footer>
      <p>2026 PawCare Veterinary Clinic Management System.</p>
    </footer>

    <script src="register.js"></script>
  </body>
</html>
