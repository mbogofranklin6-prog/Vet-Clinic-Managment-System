<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | PawCare</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <div class="logo">
          <i class="fa-solid fa-paw"></i>
          <h2>PawCare</h2>
        </div>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="register.html">Register Pet</a></li>
          <li><a href="appointment.html">Appointments</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </header>

    <section class="page-header">
      <h1>Contact PawCare</h1>

      <p>We'd love to hear from you.</p>
    </section>

    <section class="contact-container">
      <div class="contact-info">
        <h2>Get In Touch</h2>

        <p><i class="fa-solid fa-location-dot"></i> Nairobi, Kenya</p>

        <p><i class="fa-solid fa-phone"></i> +254 769 547 759</p>

        <p><i class="fa-solid fa-envelope"></i> info@pawcare.com</p>

        <p><i class="fa-solid fa-clock"></i> Mon - Sat: 8:00 AM - 6:00 PM</p>
      </div>

      <div class="contact-form">
        <form>
          <input type="text" placeholder="Your Name" required />

          <input type="email" placeholder="Your Email" required />

          <input type="text" placeholder="Subject" required />

          <textarea rows="6" placeholder="Your Message"></textarea>

          <button type="submit" class="btn">Send Message</button>
        </form>
      </div>
    </section>

    <footer>
      <p>2026 PawCare Veterinary Clinic Management System</p>
    </footer>
  </body>
</html>
